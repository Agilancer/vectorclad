<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sovereign viewer</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; background: #e9e4de; color: #1d1b18; font: 13px ui-monospace, "Share Tech Mono", monospace; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #bar { position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); }
  #bar button { background: rgba(255, 255, 255, 0.75); color: inherit; border: 1px solid rgba(0, 0, 0, 0.2); padding: 6px 10px; font: inherit; cursor: pointer; border-radius: 3px; }
  #bar button[aria-pressed="true"] { background: #1d1b18; color: #e9d9b8; }
  #ref { position: fixed; right: 10px; bottom: 10px; width: min(26vw, 260px); border: 1px solid rgba(0, 0, 0, 0.2); display: none; }
  body.compare #ref { display: block; }
  #info { position: fixed; left: 10px; bottom: 10px; background: rgba(255, 255, 255, 0.75); padding: 6px 10px; border-radius: 3px; }
  body.shot #bar, body.shot #info { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<img id="ref" alt="Reference art">
<div id="info">Drag to orbit, wheel to zoom</div>
<!-- A turntable for the BK-09 Sovereign: tools/sovereign.html?view=ref&armed=1&outline=0&ref=<image url> -->
<script type="module" src="sovereign-viewer.js"></script>
</body>
</html>
