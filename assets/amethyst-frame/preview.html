<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM-05 Amethyst</title>
<style>
  :root { color-scheme: dark; --fg: #e3e6ea; --dim: #9aa1ab; --bg: #15191d; --panel: #1f252b; --line: #323a42; --acc: #b48cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 14px 16px 6px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
  h1 { margin: 0; font-size: 18px; letter-spacing: 0.04em; }
  h1 span { color: var(--acc); font-family: ui-monospace, monospace; margin-right: 8px; }
  header p { margin: 0; color: var(--dim); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 6px 16px 10px; align-items: center; }
  label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
  select, button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  main { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 0 16px 16px; }
  main.compare { grid-template-columns: 1fr 1fr; }
  #view, #ref { width: 100%; height: min(72vh, 760px); display: block; border-radius: 8px; background: #e9e6e1; touch-action: none; }
  #ref { object-fit: contain; display: none; }
  main.compare #ref { display: block; }
  #status { color: var(--dim); padding: 0 16px 16px; }
  @media (max-width: 720px) { main.compare { grid-template-columns: 1fr; } #view, #ref { height: 60vh; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1><span>AM-05</span>Amethyst</h1>
  <p>VECTORCLAD frame on the stock rig: Blender armor from am05.glb, sprung back pylons. Drag to orbit, scroll to zoom.</p>
</header>
<div class="bar">
  <label>Motion <select id="motion">
    <option value="reference">Reference stance</option><option value="idle">Idle</option><option value="walk">Walk</option>
    <option value="run">Run</option><option value="dash">Boost dash</option><option value="jump">Jump jets</option>
    <option value="aim">Aim</option><option value="reload">Reload</option>
  </select></label>
  <label>Camera <select id="cam">
    <option value="front">Front</option><option value="back">Back</option><option value="side">Side</option><option value="three">Three quarter</option><option value="head">Head</option><option value="headside">Head, side</option><option value="chase">Behind (game camera)</option>
  </select></label>
  <label>Show <select id="show">
    <option value="amethyst">Amethyst</option><option value="both">Next to the Vanguard</option>
  </select></label>
  <label><input type="checkbox" id="compare"> Reference</label>
  <label>Sheet <select id="sheet"><option value="reference-body.webp">Body</option><option value="reference-head.webp">Head</option><option value="reference-pylon.webp">Pylon</option></select></label>
  <button id="pause" type="button" aria-pressed="false">Pause</button>
</div>
<main id="main"><canvas id="view" aria-label="AM-05 Amethyst mech model"></canvas><img id="ref" src="reference-body.webp" alt="Reference sheet"></main>
<div id="status">Loading…</div>
<script type="module">
import * as THREE from '../../js/three.js';
import { Mech } from '../../js/mech.js';
import { makeMaterials, applyPaint, PAINTS, glowTexture } from '../../js/atlas.js';
// ?anything on the page's address reloads the model module past the browser cache
const { AmethystMech, loadAmethystDetail } = await import('./amethyst-mech.js' + location.search);
await loadAmethystDetail(new URL('./am05.glb' + location.search, location.href).href);

const $ = (s) => document.querySelector(s);
const canvas = $('#view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e6e1);
scene.add(new THREE.HemisphereLight(0xf2f6ff, 0x8a8076, 2.4));
const key = new THREE.DirectionalLight(0xffffff, 3.2);
key.position.set(8, 18, 14); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -12, right: 12, top: 16, bottom: -4, far: 60 }); key.shadow.normalBias = 0.03;
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe6ff, 1.4); rim.position.set(-10, 8, -12); scene.add(rim);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0xdcd6cd, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const camera = new THREE.PerspectiveCamera(20, 1, 0.1, 500);

const loader = new THREE.TextureLoader();
const [body, weapons] = await Promise.all(['../../textures/body.jpg', '../../textures/weapons.jpg'].map((u) => loader.loadAsync(u)));
for (const t of [body, weapons]) t.colorSpace = THREE.SRGBColorSpace;
const mats = makeMaterials({ body, weapons });
applyPaint(mats, PAINTS[0]);
const glow = glowTexture();
const amethyst = new AmethystMech(mats, glow);
const vanguard = new Mech(mats, glow);
scene.add(amethyst.root, vanguard.root);
const mechs = [amethyst, vanguard];

const S = { motion: 'reference', cam: 'front', show: 'amethyst', yaw: 0, pitch: 0.04, dist: 46, z: 0, t: 0, paused: false };
const ANG = { front: 0, back: Math.PI, side: Math.PI / 2, three: 0.7, head: 0.35, headside: Math.PI / 2, chase: Math.PI };
function state(speed) {
  const m = S.motion;
  return {
    gait: Math.min(1, speed / 7.5), air: m === 'jump' ? 1 : 0, dash: m === 'dash' ? 1 : 0, crouch: 0,
    vel: new THREE.Vector3(0, 0, speed), bodyYaw: 0, ground: 0, legYaw: 0,
    aimYaw: m === 'aim' ? 0.25 : 0, aimPitch: m === 'aim' ? 0.08 : 0,
    aim: m === 'aim' ? [1, 1] : [0, 0], recoil: [0, 0], reload: [m === 'reload', false], shield: false, hasShield: false,
    thrust: m === 'jump' ? { main: 0.9, vern: 0.3, calf: 0.8, sole: 0.9 } : m === 'dash' ? { main: 1, vern: 0.8, calf: 0.4, sole: 0.2 } : { main: 0, vern: 0, calf: 0, sole: 0 },
    time: S.t,
  };
}
function layout() {
  S.motion = $('#motion').value; S.cam = $('#cam').value; S.show = $('#show').value;
  $('#main').classList.toggle('compare', $('#compare').checked);
  vanguard.root.visible = S.show === 'both';
  amethyst.root.position.x = S.show === 'both' ? -3.4 : 0;
  vanguard.root.position.x = 3.4;
  S.yaw = ANG[S.cam];
  S.dist = S.cam.startsWith('head') ? 12 : S.cam === 'chase' ? 30 : S.show === 'both' ? 64 : 50;
  $('#ref').src = $('#sheet').value;
  for (const m of mechs) { m.resetFeet(); m.root.position.z = 0; }
  S.z = 0;
  if (S.motion === 'reference') amethyst.poseReference();
  resize();
}
function draw() {
  const target = new THREE.Vector3(0, 5.6, S.z);
  if (S.cam.startsWith('head')) { amethyst.head.getWorldPosition(target); target.y += 0.6; }
  if (S.cam === 'chase') S.pitch = Math.max(S.pitch, 0.18);
  camera.position.set(target.x + Math.sin(S.yaw) * Math.cos(S.pitch) * S.dist, target.y + Math.sin(S.pitch) * S.dist, target.z + Math.cos(S.yaw) * Math.cos(S.pitch) * S.dist);
  camera.lookAt(target);
  key.target.position.copy(target); key.target.updateMatrixWorld();
  renderer.render(scene, camera);
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  draw();
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  if (!S.paused) step(dt);
  if (!S.hold) draw();
  requestAnimationFrame(tick);
}
function step(dt) {
  S.t += dt;
  const speed = { walk: 3.5, run: 7.5, dash: 14 }[S.motion] || 0;
  S.z += speed * dt;
  for (const m of mechs) {
    m.root.position.z = S.z;
    m.root.position.y = S.motion === 'jump' ? 2.5 : 0;
    if (S.motion === 'reference' && m === amethyst) continue;
    m.animate(dt, state(speed));
  }
}
for (const id of ['motion', 'cam', 'show', 'compare', 'sheet']) $('#' + id).addEventListener('change', layout);
$('#pause').addEventListener('click', (e) => { S.paused = !S.paused; e.target.textContent = S.paused ? 'Play' : 'Pause'; e.target.setAttribute('aria-pressed', String(S.paused)); });
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  S.yaw -= (e.clientX - drag[0]) * 0.008;
  S.pitch = Math.max(-0.2, Math.min(1.3, S.pitch + (e.clientY - drag[1]) * 0.008));
  drag = [e.clientX, e.clientY];
});
canvas.addEventListener('pointerup', () => { drag = null; });
canvas.addEventListener('wheel', (e) => { e.preventDefault(); S.dist = Math.max(6, Math.min(120, S.dist * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });
addEventListener('resize', resize);
for (let i = 0; i < 60; i++) vanguard.animate(1 / 30, state(0));
layout();
requestAnimationFrame(tick);
$('#status').textContent = 'Ready. The reference stance is a static inspection pose; every other motion is the stock Mech.animate() running on the Amethyst, plus its pylon swing.';
// For tools/tests/amethyst.js
window.viewer = { S, amethyst, vanguard, scene, camera, renderer, layout, draw, step, set(o) { for (const [k, v] of Object.entries(o)) { const el = $('#' + k); if (el.type === 'checkbox') el.checked = v; else el.value = v; } layout(); } };
</script>
</body>
</html>
